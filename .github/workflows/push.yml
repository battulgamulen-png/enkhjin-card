name: Push мэдэгдэл явуулах

on:
  schedule:
    # Улаанбаатарын цагаар 08:30 (UTC 00:30)
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      title:
        description: "Гарчиг"
        default: "Чойгоос ✦"
      message:
        description: "Мессеж"
        required: true

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebpush
      - name: Мэдэгдэл явуулах
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_TITLE: ${{ github.event.inputs.title }}
          PUSH_BODY: ${{ github.event.inputs.message }}
        run: python send_push.py
      - name: Хүчингүй бүртгэл хасагдсан бол commit хийх
        run: |
          git diff --quiet -- subscriptions.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscriptions.json && git commit -m "Push бүртгэл цэвэрлэв" && git push
